trigger: none
pr: none
pool: DEFRA-COMMON-ubuntu2004-SSV3

parameters:
  - name: envToDeploy
    displayName: Target deployment env
    type: string
    values:
      - tst
      - pre
      - prd
    default: tst

variables:
  - group: ServiceConnections
  - ${{ if eq(parameters.envToDeploy, 'tst') }}:
    - name: containerName
      value: 'b2c-styling-files'
  - ${{ else }}:
    - name: containerName
      value: 'epr-account-styling'

steps:
  - task: CopyFiles@2
    displayName: 'Copy static website content'
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)/${{ parameters.envToDeploy }}'
      contents: '**'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
      CleanTargetFolder: true

  - task: AzureCLI@2
    displayName: Publish static website files to blob container
    inputs:
        azureSubscription: $(ServiceConnection${{ upper(parameters.envToDeploy) }}1)
        scriptType: 'pscore'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az storage blob upload-batch -d '$(containerName)' -s '$(Build.ArtifactStagingDirectory)' --account-name ${{ parameters.envToDeploy }}rwddbssa1402 --auth-mode login --overwrite true
        CleanTargetBeforeCopy: true
